# Publishes the project page (site/, built by `make site`) as GitHub Pages. Needs
# Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - Makefile
      - internal/common/static/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and deploy are separate jobs, like GitHub's Pages template: in one job,
  # deploy-pages often ran before the uploaded artifact could be found.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
